name: Release

# When you publish a GitHub release (you write the notes), build a universal
# (arm64 + x86_64) macOS build, package it as a .pkg inside a .dmg, sign and
# notarize both, and attach the .dmg to the release. Also runs on demand
# (workflow_dispatch) to produce an unsigned artifact for testing.
#
# macOS signing + notarization run only when these repo secrets exist:
#   MACOS_CERT_P12          base64 of the "Developer ID Application" .p12
#                           (base64 -i cert.p12 | pbcopy)
#   MACOS_CERT_PASSWORD     the .p12's password
#   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Name (TEAMID)"
#   MACOS_INSTALLER_IDENTITY  e.g. "Developer ID Installer: Name (TEAMID)"
#   APPLE_ID                Apple-ID email for notarytool
#   APPLE_TEAM_ID           10-char team id
#   APPLE_APP_PASSWORD      app-specific password (appleid.apple.com)
# Without them the job still builds an unsigned .dmg (not installable without a
# right-click "Open", but useful to verify the packaging).
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write # attach the release asset

jobs:
  macos:
    name: Universal macOS build (.pkg in .dmg)
    runs-on: macos-14
    env:
      HAVE_SIGNING: ${{ secrets.MACOS_CERT_P12 != '' }}
      ART: build/asid/SidStationAsid_artefacts/Release
      NAME: SidStation ASID
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and check the tag
        id: ver
        run: |
          V=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "SidStation ASID version: $V"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            test "$TAG" = "v$V" \
              || { echo "::error::release tag $TAG does not match CMake version v$V"; exit 1; }
          fi

      - name: Configure (universal)
        run: |
          # 10.15 is the floor: the core uses std::filesystem, which Apple only
          # made available in the 10.15 SDK runtime.
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15

      - name: Build (AU + VST3 + Standalone)
        run: cmake --build build --config Release

      # ── signing (skipped unless the secrets are configured) ──────────────
      - name: Import signing certificate
        if: env.HAVE_SIGNING == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build/signing.keychain-db
          KEYCHAIN_PW=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 -d > build/cert.p12
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"  # 6 h (covers notarize waits)
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import build/cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm build/cert.p12

      - name: Codesign the bundles (hardened runtime)
        if: env.HAVE_SIGNING == 'true'
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          for b in "$ART/AU/$NAME.component" "$ART/VST3/$NAME.vst3" "$ART/Standalone/$NAME.app"; do
            codesign --force --options runtime --timestamp \
              --entitlements packaging/entitlements.plist --sign "$IDENTITY" "$b"
            codesign --verify --strict "$b"
          done

      # The .pkg and .dmg file names are space-free (the bundles inside keep their
      # proper "SidStation ASID" names); paths are recomputed per step from the
      # version so a space in a filename can never trip up a later tool.
      - name: Build the installer package
        env:
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: |
          mkdir -p build/dist
          PKG="build/dist/SidStation-ASID-${{ steps.ver.outputs.version }}.pkg"
          bash packaging/make-pkg.sh "${{ steps.ver.outputs.version }}" "$ART" "$PKG"
          ls -la build/dist

      - name: Notarize and staple the package
        if: env.HAVE_SIGNING == 'true'
        timeout-minutes: 60
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          PKG="build/dist/SidStation-ASID-${{ steps.ver.outputs.version }}.pkg"
          bash packaging/notarize.sh "$PKG"
          xcrun stapler staple "$PKG"

      - name: Build the DMG
        run: |
          V="${{ steps.ver.outputs.version }}"
          PKG="build/dist/SidStation-ASID-$V.pkg"
          mkdir -p build/dmgroot
          cp "$PKG" "build/dmgroot/$NAME.pkg"   # nice spaced name inside the mounted DMG
          hdiutil create -volname "$NAME $V" -srcfolder build/dmgroot \
            -ov -format UDZO "build/dist/SidStation-ASID-$V.dmg"

      - name: Sign, notarize and staple the DMG
        if: env.HAVE_SIGNING == 'true'
        timeout-minutes: 60
        env:
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="build/dist/SidStation-ASID-${{ steps.ver.outputs.version }}.dmg"
          codesign --force --timestamp --sign "$IDENTITY" "$DMG"
          bash packaging/notarize.sh "$DMG"
          xcrun stapler staple "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: SidStation-ASID-macos
          path: build/dist/SidStation-ASID-*.dmg

      - name: Attach the DMG to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/dist/SidStation-ASID-*.dmg --clobber

      # The landing page advertises a version and a date in its structured data
      # and its sitemap. Stamp them from the release that just shipped, so the
      # site cannot drift from what is actually downloadable. Runs last: if the
      # build or notarization failed there is nothing to advertise. The version
      # is the one checked against the tag above, not whatever main says now.
      - name: Stamp the docs site with the released version
        if: github.event_name == 'release' && github.event.release.prerelease == false
        env:
          PUBLISHED_AT: ${{ github.event.release.published_at }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 packaging/stamp-docs.py \
            --version "${{ steps.ver.outputs.version }}" --date "${PUBLISHED_AT%%T*}"
          if git diff --quiet -- docs; then
            echo "docs already current, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml
          git commit -m "Stamp the docs site for $TAG"
          git push origin main

  linux:
    name: Linux build (tarball)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and check the tag
        id: ver
        run: |
          V=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            test "$TAG" = "v$V" \
              || { echo "::error::release tag $TAG does not match CMake version v$V"; exit 1; }
          fi

      - name: Install JUCE build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libjack-jackd2-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Configure and build (VST3 + Standalone)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package tarball
        run: |
          V="${{ steps.ver.outputs.version }}"
          ART="build/asid/SidStationAsid_artefacts/Release"
          stage="SidStation-ASID-$V-linux-x86_64"
          mkdir -p "$stage"
          cp -R "$ART/VST3/SidStation ASID.vst3" "$stage/"
          cp "$ART/Standalone/SidStation ASID" "$stage/"
          cp packaging/linux/INSTALL.txt "$stage/"
          cp LICENSE "$stage/LICENSE.txt"
          mkdir -p build/dist
          tar -czf "build/dist/$stage.tar.gz" "$stage"
          ls -la build/dist

      - uses: actions/upload-artifact@v4
        with:
          name: SidStation-ASID-linux
          path: build/dist/SidStation-ASID-*-linux-*.tar.gz

      - name: Attach the tarball to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/dist/SidStation-ASID-*-linux-*.tar.gz --clobber

  windows:
    name: Windows build (Inno Setup installer)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash  # Git Bash, so grep/cp/tar behave like the other jobs
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version and check the tag
        id: ver
        run: |
          V=$(grep -m1 -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | awk '{print $2}')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            test "$TAG" = "v$V" \
              || { echo "::error::release tag $TAG does not match CMake version v$V"; exit 1; }
          fi

      - name: Configure and build (VST3 + Standalone)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Stage artefacts
        run: |
          ART="build/asid/SidStationAsid_artefacts/Release"
          mkdir -p build/winstage/VST3 build/winstage/Standalone
          cp -R "$ART/VST3/SidStation ASID.vst3" build/winstage/VST3/
          cp "$ART/Standalone/SidStation ASID.exe" build/winstage/Standalone/
          cp LICENSE build/winstage/LICENSE.txt

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path build/dist | Out-Null
          $stage = (Resolve-Path build/winstage).Path
          $out = (Resolve-Path build/dist).Path
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$V" "/DSrcDir=$stage" "/DOutDir=$out" packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: SidStation-ASID-windows
          path: build/dist/SidStation-ASID-*-setup.exe

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" build/dist/SidStation-ASID-*-setup.exe --clobber
