name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: every job here only checks out and builds
  # The one exception is the format job, which raises itself to write so it can
  # push the docs dates back to main. It says so at the job.

# A second push to the same branch makes the first run's answer irrelevant, so
# stop it rather than pay for two builds on three platforms. Keyed by ref, so
# branches never cancel each other. Not applied to the release workflow: a tag
# build halfway through notarization is not something to interrupt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs first because it is the cheapest signal: no compiler, no JUCE checkout,
  # under a minute. Checks formatting for all three languages and lints the
  # Python. Reproducible only because every formatter is pinned, in
  # package-lock.json and requirements-dev.txt; an unpinned one would fail here
  # on a contributor who did nothing wrong. Fix locally with `make format`.
  format:
    name: Formatting and lint
    runs-on: ubuntu-latest
    # Write, only for this job and only so the stamp step below can push the
    # dates back to main. Every other job keeps the read-only default above.
    permissions:
      contents: write
    # Every job here caps its own wall clock. The default is GitHub's 6 h, which
    # is not a timeout so much as a blank cheque: a wedged network fetch (apt
    # mirror, JUCE clone) stops being a failure and becomes a job that burns a
    # day of runner minutes before anyone notices. Each cap is a few times the
    # normal run, so it only ever fires on something genuinely stuck.
    timeout-minutes: 10
    steps:
      # Full history, because stamp-check dates each docs page from the last
      # commit that touched it. The default depth of 1 would resolve every path
      # to HEAD, so every page would look modified today: plausible, and wrong.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # `make format-check` installs the pinned tools itself, into node_modules
      # and .venv, so this is the same command run the same way as locally.
      - name: Check formatting and lint
        run: make format-check
      # The docs screenshots are generated but committed, since GitHub Pages has
      # no build step. This catches a source updated without re-running the
      # encoder, which would otherwise publish a stale screenshot.
      - name: Check generated screenshots are up to date
        run: make images-check
      # Catches an asset path that did not follow a page to a new depth, which
      # renders fine locally and 404s once published.
      - name: Check docs links resolve
        run: make links-check
      # The sitemap lastmod and the JSON-LD dateModified of each page are what
      # search engines read as freshness, and nothing about editing a page keeps
      # them right. This catches the page that changed without its date, which
      # is how the whole site sat two weeks behind after 1.2.0.
      #
      # A pull request only gets told. Its head branch may live on a fork, where
      # this job has no write access whatever the permissions above say, so the
      # fix has to be `make stamp` in the contributor's own clone.
      - name: Check docs dates match git history
        if: github.event_name == 'pull_request'
        run: make stamp-check
      # On main it is fixed instead of reported, because every docs commit would
      # otherwise fail this job and need a second commit that does nothing but
      # move dates. Same thing the release workflow does with the release values,
      # minus --version and --date: the page dates come from git history alone.
      #
      # The push uses GITHUB_TOKEN, and a push made with that token does not
      # start another workflow run, so this cannot loop back into itself.
      - name: Stamp docs dates from git history and push
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          git checkout -B main origin/main
          make stamp
          if git diff --quiet -- docs CITATION.cff; then
            echo "docs dates already current, nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage whatever the script wrote rather than a list kept by hand, so
          # a file it learns to stamp later is not silently left behind.
          git add -A docs CITATION.cff
          # The subject has to start with "Stamp ", which is what stamp-docs.py
          # skips when dating a page. Without it this commit would look like an
          # edit to every page it touched, and the next run would date them all
          # forward again, on and on.
          git commit -m "Stamp the docs dates from git history"
          git push origin main

  core-tests:
    name: Core protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and run core tests
        run: make -C core test

  # The plugin is developed on macOS, so until now Windows and Linux were first
  # compiled during a tag build. That is the worst place to find a break: the tag
  # is already public and half the release is done. These two jobs run the same
  # configure and build lines the release workflow does, on the same images, so a
  # missing include MSVC wants or a stricter GCC warning fails a pull request
  # instead. They build the wrappers too, which the macOS job below does not.
  #
  # Build only, no test run. The JUCE-linked tests instantiate the processor,
  # which opens MIDI devices, and a headless runner with no sound stack is a poor
  # place to judge that. macOS runs them.
  plugin-build-linux:
    name: Plugin build (Linux)
    # The image the release tarball is built on, not ubuntu-latest, so this
    # checks the environment that actually ships.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install JUCE build dependencies
        timeout-minutes: 10
        run: bash .github/scripts/install-linux-deps.sh
      - name: Configure and build (VST3 + Standalone)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

  plugin-build-windows:
    name: Plugin build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60 # the slowest of the three, and MSVC is not quick
    defaults:
      run:
        shell: bash # match the release job, so the commands are the same ones
    steps:
      - uses: actions/checkout@v7
      - name: Configure and build (VST3 + Standalone)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

  plugin-build:
    name: Plugin build + JUCE-linked tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSID_BUILD_TESTS=ON
      # Builds the console test app, which compiles the full processor and editor
      # (so it also validates that the plugin code compiles) and links the core.
      - name: Build
        run: cmake --build build --target SidStationAsidTests --config Release
      - name: Run JUCE-linked tests
        run: |
          # Locate the built executable inside the target's artefacts folder: an
          # executable file, not the JuceLibraryCode helper files or the .dSYM.
          bin=$(find build -type f -perm +111 -path "*SidStationAsidTests_artefacts*" \
                  ! -path "*JuceLibraryCode*" ! -path "*.dSYM*" | head -1)
          if [ -z "$bin" ]; then
            echo "::error::Test executable not found under build/"
            find build -path "*artefacts*" -print
            exit 1
          fi
          echo "Running: $bin"
          "$bin"
