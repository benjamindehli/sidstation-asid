name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run core tests
        run: make -C core test

  plugin-build:
    name: Plugin build + JUCE-linked tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # FetchContent clones JUCE into build/_deps; cache it so reruns skip the clone.
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.15-${{ runner.os }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSID_BUILD_TESTS=ON
      # Builds the console test app, which compiles the full processor and editor
      # (so it also validates that the plugin code compiles) and links the core.
      - name: Build
        run: cmake --build build --target SidStationAsidTests --config Release
      - name: Run JUCE-linked tests
        run: |
          # Locate the built executable by its artefacts folder rather than its
          # product name (JUCE puts it under <target>_artefacts/<config>/).
          bin=$(find build -type f -path "*SidStationAsidTests_artefacts*" ! -path "*.dSYM*" | head -1)
          if [ -z "$bin" ]; then
            echo "::error::Test executable not found under build/"
            find build -path "*artefacts*" -print
            exit 1
          fi
          echo "Running: $bin"
          "$bin"
