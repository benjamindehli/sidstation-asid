name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege: CI only checks out and builds

jobs:
  # Runs first because it is the cheapest signal: no compiler, no JUCE checkout,
  # under a minute. Checks formatting for all three languages and lints the
  # Python. Reproducible only because every formatter is pinned, in
  # package-lock.json and requirements-dev.txt; an unpinned one would fail here
  # on a contributor who did nothing wrong. Fix locally with `make format`.
  format:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # `make format-check` installs the pinned tools itself, into node_modules
      # and .venv, so this is the same command run the same way as locally.
      - name: Check formatting and lint
        run: make format-check
      # The docs screenshots are generated but committed, since GitHub Pages has
      # no build step. This catches a source updated without re-running the
      # encoder, which would otherwise publish a stale screenshot.
      - name: Check generated screenshots are up to date
        run: make images-check
      # Catches an asset path that did not follow a page to a new depth, which
      # renders fine locally and 404s once published.
      - name: Check docs links resolve
        run: make links-check

  core-tests:
    name: Core protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and run core tests
        run: make -C core test

  plugin-build:
    name: Plugin build + JUCE-linked tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSID_BUILD_TESTS=ON
      # Builds the console test app, which compiles the full processor and editor
      # (so it also validates that the plugin code compiles) and links the core.
      - name: Build
        run: cmake --build build --target SidStationAsidTests --config Release
      - name: Run JUCE-linked tests
        run: |
          # Locate the built executable inside the target's artefacts folder: an
          # executable file, not the JuceLibraryCode helper files or the .dSYM.
          bin=$(find build -type f -perm +111 -path "*SidStationAsidTests_artefacts*" \
                  ! -path "*JuceLibraryCode*" ! -path "*.dSYM*" | head -1)
          if [ -z "$bin" ]; then
            echo "::error::Test executable not found under build/"
            find build -path "*artefacts*" -print
            exit 1
          fi
          echo "Running: $bin"
          "$bin"
