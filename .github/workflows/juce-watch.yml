name: JUCE watch

# Dependabot covers the formatters, the image tooling and the actions, but it
# does not read CMake FetchContent, so the JUCE pin in CMakeLists.txt would
# otherwise only move when someone remembers to look. This compares that pin
# with JUCE's latest GitHub release once a month and opens an issue when a newer
# one is out. It changes nothing itself: a JUCE upgrade has touched MIDI and
# SysEx code before, so it needs a person and the hardware, not an auto-merge.
#
# One issue per JUCE version. The duplicate check includes closed issues, so
# closing one ("not taking this version") keeps it closed rather than having it
# reopened every month. The next release gets an issue of its own.

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st, the same monthly rhythm as Dependabot
  workflow_dispatch:

permissions:
  contents: read
  issues: write # the only write: opening the issue

jobs:
  check:
    name: Compare the JUCE pin with the latest release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Open an issue if JUCE has a newer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # The tag on the GIT_TAG line of the JUCE FetchContent_Declare.
          pinned=$(sed -n 's/^[[:space:]]*GIT_TAG[[:space:]]\+\([0-9][0-9.]*\)[[:space:]]*$/\1/p' CMakeLists.txt)
          if [ -z "$pinned" ] || [ "$(printf '%s\n' "$pinned" | wc -l)" -ne 1 ]; then
            echo "::error::Could not read a single JUCE GIT_TAG from CMakeLists.txt (got '$pinned')"
            exit 1
          fi

          # releases/latest skips drafts and pre-releases, so a beta never opens an issue.
          latest=$(gh api repos/juce-framework/JUCE/releases/latest --jq .tag_name)
          echo "Pinned: $pinned. Latest release: $latest."

          # Newer by version order, not just different, so a pin ahead of the
          # latest release (a hand-picked tag or commit) stays quiet.
          newest=$(printf '%s\n%s\n' "$pinned" "$latest" | sort -V | tail -n 1)
          if [ "$latest" = "$pinned" ] || [ "$newest" != "$latest" ]; then
            echo "Up to date."
            exit 0
          fi

          title="JUCE $latest is available"
          existing=$(gh issue list --state all --search "\"$title\" in:title" --json title \
            --jq "map(select(.title == \"$title\")) | length")
          if [ "$existing" -gt 0 ]; then
            echo "An issue titled '$title' already exists. Nothing to do."
            exit 0
          fi

          cat > body.md <<EOF
          JUCE [$latest](https://github.com/juce-framework/JUCE/releases/tag/$latest) is out. The build is pinned to $pinned in \`CMakeLists.txt\`.

          - [ ] Read [BREAKING_CHANGES.md](https://github.com/juce-framework/JUCE/blob/$latest/BREAKING_CHANGES.md) and [CHANGE_LIST.md](https://github.com/juce-framework/JUCE/blob/$latest/CHANGE_LIST.md) back to $pinned, and check the plugin uses none of what changed.
          - [ ] Check the [Linux dependencies](https://github.com/juce-framework/JUCE/blob/$latest/docs/Linux%20Dependencies.md) against \`.github/scripts/install-linux-deps.sh\`.
          - [ ] Diff \`modules/juce_audio_devices\` between the two tags. The ASID stream is SysEx, so MIDI output changes need a hardware test on every platform they touch.
          - [ ] Bump \`GIT_TAG\` and let the pull request build all three platforms.
          - [ ] Add a line to \`CHANGELOG.md\`.

          Opened by the JUCE watch workflow. Close this issue to skip $latest. The next release will open a new one.
          EOF

          gh issue create --title "$title" --body-file body.md
